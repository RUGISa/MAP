  function svg(name){return `<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">${ICON[name]||ICON.generic}</svg>`;}

  function localMatches(term){

  async function copyText(value){

    <div class="detail-actions${p.address?' has-address':''}"><button class="detail-action${saved?' active':''}" data-action="favorite" type="button">${svg('bookmark')}<span>${esc(loc(saved?'unfavorite':'favorite'))}</span></button>${addressAction}<button class="detail-action" data-action="copy" type="button">${svg('copy')}<span>${esc(loc('copyCoordinates'))}</span></button><button class="detail-action" data-action="share" type="button">${svg('share')}<span>${esc(loc('share'))}</span></button></div>
    <p class="detail-note">${esc(p.approximate?loc('demoNotice'):loc('liveNotice'))}</p>
    <section class="route-section"><h3 class="detail-section-title">${esc(loc('directStart'))}</h3><div class="transport-switch">${[['walk','walk'],['public','public'],['bike','bike'],['car','car']].map(([mode,icon])=>`<button data-mode="${mode}" class="${state.mode===mode?'active':''}" type="button">${svg(icon)}<span>${esc(loc(mode))}</span></button>`).join('')}</div><button type="button" class="route-primary" data-action="route">${svg('arrow')}<span>${esc(loc('getDirections'))} · Kakao Map</span></button><p class="route-explain">${esc(loc('destination'))}</p></section>
    <section class="external-section"><h3 class="detail-section-title">${esc(loc('externalMaps'))}</h3><div class="provider-list"><button class="provider-link" type="button" data-action="kakao"><span><span class="provider-symbol kakao">K</span>${esc(loc('openKakao'))}</span>${svg('external')}</button><button class="provider-link" type="button" data-action="naver"><span><span class="provider-symbol">N</span>${esc(loc('openNaver'))}</span>${svg('external')}</button><button class="provider-link" type="button" data-action="google"><span><span class="provider-symbol google">G</span>${esc(loc('openGoogle'))}</span>${svg('external')}</button></div></section>`;
  }
  function render(){
    if(state.tab==='explore')E('panel-content').innerHTML=renderExplore();
    else if(state.tab==='saved')E('panel-content').innerHTML=renderCollection(state.favorites,loc('emptySaved'),loc('emptySavedDesc'));
    else E('panel-content').innerHTML=renderCollection(state.recent,loc('emptyRecent'),loc('emptyRecentDesc'));
    $$('.tab').forEach(el=>{let active=el.dataset.tab===state.tab;el.classList.toggle('active',active);el.setAttribute('aria-selected',String(active));});
    E('saved-count').textContent=state.favorites.length;E('saved-count').classList.toggle('hidden',state.favorites.length===0);
    E('search-button').classList.toggle('busy',state.loading);
    E('clear-search').classList.toggle('hidden',!E('search-input').value);
  }
  function chooseTab(tab){if(!['explore','saved','recent'].includes(tab))return;state.tab=tab;state.selected=null;render();refreshMarkers();E('panel-scroll').scrollTop=0;}
  function choosePlace(p,addRecent=true){
    if(!p)return;
    state.selected=p;
    if(addRecent)storeRecent(p);
    render();refreshMarkers();
    if(state.map){flyToPlace(p.lat,p.lon,Math.max(15,state.map.getZoom()),650);}
    E('panel-scroll').scrollTop=0;
  }
  function back(){state.selected=null;render();refreshMarkers();E('panel-scroll').scrollTop=0;}
  function toggleFavorite(){const p=state.selected;if(!p)return;const before=isSaved(p);state.favorites=before?state.favorites.filter(f=>f.id!==p.id):[p,...state.favorites].slice(0,100);persist('nabi-favorites',state.favorites);render();showToast(loc(before?'removed':'saved'));}
  function updateResults(results){state.results=results.slice(0,16);if(state.tab!=='explore')state.tab='explore';render();refreshMarkers();}
  function flyToPlace(lat,lon,zoom=15,duration=650){
    if(!state.map)return;
    state.map.flyTo({center:[Number(lon),Number(lat)],zoom,duration,essential:true});
  }
  function createMarker(lat,lon,html,clickHandler){
    const el=document.createElement('div');
    el.className='nabi-map-marker';
    el.innerHTML=html;
    if(clickHandler)el.addEventListener('click',e=>{e.stopPropagation();clickHandler();});
    return new window.maplibregl.Marker({element:el,anchor:'center'}).setLngLat([Number(lon),Number(lat)]).addTo(state.map);
  }
  function refreshMarkers(){
    if(!state.map)return;
    state.markers.forEach(m=>m.remove());state.markers=[];
    let shown=state.selected?[state.selected]:state.tab==='saved'?state.favorites:state.tab==='recent'?state.recent:state.searched?state.results:[];
    shown=shown.slice(0,24);
    shown.forEach(p=>{
      if(!inKorea(Number(p.lat),Number(p.lon)))return;
      const html=`<div class="nabi-marker${state.selected?.id===p.id?' active':''}${p.source==='demo'?' demo':''}"></div>`;
      const m=createMarker(p.lat,p.lon,html,()=>choosePlace(p));state.markers.push(m);
    });
  }
  function initialMap(){
    if(typeof window.maplibregl==='undefined'){
      displayMapError('지도 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.','地図ライブラリを読み込めませんでした。インターネット接続をご確認ください。');
      return;
    }
    try{
      const init=CITIES.busan;
      state.map=new window.maplibregl.Map({
        container:'map',
        style:'https://tiles.openfreemap.org/styles/positron',
        center:[init[1],init[0]],zoom:init[2],
        minZoom:5.5,maxZoom:19,
        attributionControl:true,dragRotate:false,pitchWithRotate:false,
        refreshExpiredTiles:true
      });
      // The public OpenFreeMap instance permits file:// usage without a key.
      // Do not silently revert to OSM Foundation's restricted tile.openstreetmap.org.
      let loaded=false;
      const loadingWarning=setTimeout(()=>{
        if(!loaded)displayMapError('지도 데이터 연결에 실패했습니다. 네트워크를 확인하거나 새로고침해 주세요.','地図の接続に失敗しました。ネットワークをご確認ください。');
      },15000);
      state.map.on('load',()=>{loaded=true;clearTimeout(loadingWarning);hideMapError();});
      state.map.on('error',e=>{console.warn('MapLibre map resource error:',e.error||e);});
      state.map.on('click',event=>{
        const lat=event.lngLat.lat,lon=event.lngLat.lng;
        if(!inKorea(lat,lon))return;
        const p={id:`pin-${lat.toFixed(5)}-${lon.toFixed(5)}`,ko:'지도에서 지정한 위치',ja:'地図で指定した位置',lat,lon,type:'pin',area:coords({lat,lon}),source:'custom',approximate:false,aliases:[]};
        choosePlace(p);
      });
      state.map.on('moveend',()=>{
        const center=state.map.getCenter();let city=null;
        for(const [id,p] of Object.entries(CITIES))if(distance({lat:center.lat,lon:center.lng},{lat:p[0],lon:p[1]})<50000)city=id;
        if(city){state.city=city;$$('[data-city]').forEach(b=>b.classList.toggle('active',b.dataset.city===city));}
      });
    }catch(err){console.error('Map initialization failed',err);displayMapError('지도를 시작하지 못했습니다.','地図を開始できませんでした。');}
  }
  function displayMapError(ko,ja){
    let error=E('map-status');
    if(!error){error=document.createElement('div');error.id='map-status';error.className='map-status';E('app').appendChild(error);}
    error.innerHTML=`<strong>${state.lang==='ja'?'地図に接続できません': '지도 연결 오류'}</strong><span>${state.lang==='ja'?ja:ko}</span><button type="button" onclick="location.reload()">${state.lang==='ja'?'再読み込み':'새로고침'}</button>`;
    error.classList.add('visible');
  }
  function hideMapError(){const el=E('map-status');if(el)el.classList.remove('visible');}
  function showInitialCandidates(locals){state.searched=true;state.selected=null;state.tab='explore';state.loading=true;updateResults(locals);E('panel-scroll').scrollTop=0;if(locals.length===1&&state.map)flyToPlace(locals[0].lat,locals[0].lon,15,550);}
  function nominatimToPlace(item,seed){
    const lat=Number(item.lat),lon=Number(item.lon);
    if(!inKorea(lat,lon))return null;
    const names=item.namedetails||{};
    const main=names['name:ko']||names.name||item.name||(item.display_name||'').split(',')[0];
    const possibleNames=[names['name:ko'],names.name,item.name,(item.display_name||'').split(',')[0]].filter(Boolean).map(normalize);
    const seedNames=seed?[seed.ko,seed.ja,...seed.aliases].map(normalize):[];
    const sameName=possibleNames.some(n=>seedNames.includes(n));
    const match=Boolean(seed&&sameName&&distance({lat,lon},seed)<1600);
    const addr=item.address||{};
    const area=[addr.city||addr.town||addr.county||addr.state,addr.suburb||addr.borough||addr.city_district].filter(Boolean).join(' · ')||(item.display_name||'').split(',').slice(1,3).map(x=>x.trim()).join(' · ');
    return {id:'osm-'+(item.osm_type||'x')+'-'+(item.osm_id||item.place_id),ko:match?seed.ko:main,ja:match?seed.ja:(names['name:ja']||''),lat,lon,type:match?seed.type:deriveType(item),area:match?seed.area:area,address:item.display_name||'',aliases:[],source:'live',approximate:false};
  }
  function deriveType(item){const t=[item.type,item.class,item.addresstype].join(' ').toLowerCase();if(/station|railway|subway/.test(t))return 'station';if(/university|college/.test(t))return 'university';if(/beach/.test(t))return 'beach';if(/airport|aerodrome/.test(t))return 'airport';if(/park|garden/.test(t))return 'park';if(/mountain|peak|nature/.test(t))return 'nature';if(/market|shop|retail/.test(t))return 'market';if(/attraction|castle|temple|historic|palace/.test(t))return 'sight';return 'district';}
  function mergeResults(local,remote,seed){
    const sorted=[...remote];if(seed)sorted.sort((a,b)=>distance(a,seed)-distance(b,seed));
    const dedup=[];
    for(const p of sorted){if(!dedup.some(x=>x.id===p.id||distance(x,p)<35))dedup.push(p);}
    for(const p of local){const close=dedup.some(x=>normalize(x.ko)===normalize(p.ko)&&distance(x,p)<2500);if(!close)dedup.push(p);}
    return dedup;
  }
  const storageCache=safeLoad('nabi-cache',{});
  let searchQueue=Promise.resolve();
  async function liveSearch(query,seed,token){
    // Nominatim public service: no autocomplete, one explicit user search, throttle to <= 1 request/sec.
    // This is strictly for local beta testing. Production must use a compliant backend/provider.
    const key=normalize(query);
    if(storageCache[key]&&Date.now()-storageCache[key].at<36e5)return storageCache[key].items;
    const previous=state.lastNominatim;
    const gap=Math.max(0,1150-(Date.now()-previous));
    if(gap)await new Promise(resolve=>setTimeout(resolve,gap));
    if(token!==state.requestToken)return [];
    state.lastNominatim=Date.now();
    const searchTerm=seed?seed.ko:query;
    const url=new URL('https://nominatim.openstreetmap.org/search');
    url.searchParams.set('q',searchTerm);url.searchParams.set('format','jsonv2');url.searchParams.set('limit','8');url.searchParams.set('namedetails','1');url.searchParams.set('addressdetails','1');url.searchParams.set('countrycodes','kr');url.searchParams.set('accept-language',state.lang==='ja'?'ja,ko':'ko,ja');
    const ctl=new AbortController();const timeout=setTimeout(()=>ctl.abort(),8500);
    try{
      const response=await fetch(url.toString(),{headers:{'Accept':'application/json'},signal:ctl.signal,mode:'cors'});
      if(!response.ok)throw Error('Geocoding server '+response.status);
      const list=await response.json();if(!Array.isArray(list))throw Error('Unexpected response');
      const parsed=list.map(item=>nominatimToPlace(item,seed)).filter(Boolean);
      storageCache[key]={at:Date.now(),items:parsed};
      const cacheKeys=Object.keys(storageCache).sort((a,b)=>storageCache[a].at-storageCache[b].at);
      while(cacheKeys.length>70)delete storageCache[cacheKeys.shift()];
      persist('nabi-cache',storageCache);
      return parsed;
    }finally{clearTimeout(timeout);}
  }
  async function submitSearch(raw){
    const query=String(raw??E('search-input').value).trim();
    if(!query){E('search-input').focus();return;}
    E('search-input').value=query;state.query=query;state.lastQuery=query;
    // Also accept pasted coordinates directly; never silently swap latitude and longitude.
    const coordinateMatch=query.match(/^\s*(-?\d{1,3}(?:\.\d+)?)\s*[,\s]\s*(-?\d{1,3}(?:\.\d+)?)\s*$/);
    if(coordinateMatch){
      const lat=Number(coordinateMatch[1]),lon=Number(coordinateMatch[2]);
      if(inKorea(lat,lon)){
        ++state.requestToken;state.searched=true;state.loading=false;state.tab='explore';
        const pin={id:'pin-'+lat+'-'+lon,ko:'좌표로 지정한 위치',ja:'座標で指定した位置',lat,lon,type:'pin',area:coords({lat,lon}),source:'custom',approximate:false,aliases:[]};
        state.results=[pin];choosePlace(pin);return;
      }
    }
    const local=localMatches(query);
    const exact=local.find(p=>[p.ko,p.ja,...p.aliases].some(n=>normalize(n)===normalize(query)));
    const token=++state.requestToken;
    showInitialCandidates(local);
    try{
      // Serialize outgoing requests per tab to avoid accidental simultaneous calls.
      const work=searchQueue.catch(()=>{}).then(()=>liveSearch(query,exact||null,token));
      searchQueue=work.catch(()=>{});
      const live=await work;
      if(token!==state.requestToken)return;
      updateResults(mergeResults(local,live,exact));
    }catch(err){
      if(token!==state.requestToken)return;
      console.warn('Online search unavailable:',err);
      if(!local.length)showToast(loc('onlineFailed'));
      else showToast(loc('onlineFailedDesc'));
    }finally{
      if(token===state.requestToken){state.loading=false;render();refreshMarkers();}
    }
  }
  function openExternal(url){window.open(url,'_blank','noopener,noreferrer');}
  function kakaoLink(p,route=false){
    const point=`${encodeURIComponent(p.ko||p.ja||'목적지')},${Number(p.lat).toFixed(7)},${Number(p.lon).toFixed(7)}`;
    if(!route)return `https://map.kakao.com/link/map/${point}`;
    if(state.you){const first=`${encodeURIComponent('현재 위치')},${state.you.lat.toFixed(7)},${state.you.lon.toFixed(7)}`;const mode={walk:'walk',public:'traffic',bike:'bicycle',car:'car'}[state.mode];return `https://map.kakao.com/link/by/${mode}/${first}/${point}`;}
    return `https://map.kakao.com/link/to/${point}`;
  }
  function naverLink(p){
    const appname=window.location.protocol==='https:'||window.location.protocol==='http:'?window.location.origin+window.location.pathname:'';
    return `nmap://place?lat=${encodeURIComponent(p.lat)}&lng=${encodeURIComponent(p.lon)}&name=${encodeURIComponent(p.ko||p.ja||'장소')}&appname=${encodeURIComponent(appname)}`;
  }
  function googleLink(p){return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.lat+','+p.lon)}`;}
  function shareLink(p){
    if(location.protocol==='https:' && !['localhost','127.0.0.1'].includes(location.hostname)){
      const u=new URL(location.href);u.searchParams.set('lat',Number(p.lat).toFixed(7));u.searchParams.set('lon',Number(p.lon).toFixed(7));u.searchParams.set('ko',p.ko||'');u.searchParams.set('ja',p.ja||'');return u.toString();
    }
    return kakaoLink(p,false);
  }
  function doAction(action){
    const p=state.selected;
    if(action==='back')return back();
    if(action==='clear-recent'){state.recent=[];persist('nabi-recent',state.recent);return render();}
    if(!p)return;
    switch(action){
      case 'favorite':toggleFavorite();break;
      case 'copy':copyText(coords(p));break;
      case 'copy-address':if(p.address)copyText(p.address);break;
      case 'share':{
        const text=shareLink(p);
        if(navigator.share && window.isSecureContext){navigator.share({title:title(p),url:text}).catch(()=>copyText(text));}
        else copyText(text);
        break;
      }
      case 'route':openExternal(kakaoLink(p,true));break;
      case 'kakao':openExternal(kakaoLink(p,false));break;
      case 'naver':{
        // On mobile browsers, invoke the documented NAVER Maps URL scheme with precise coordinates.
        // On desktop, show a coordinate-centered map rather than silently changing the place.
        if(/android|iphone|ipad|ipod/i.test(navigator.userAgent) && ['https:','http:'].includes(location.protocol)){
          location.href=naverLink(p);
        }else{
          openExternal(`https://map.naver.com/p?c=${Number(p.lon).toFixed(7)},${Number(p.lat).toFixed(7)},15,0,0,0,dh`);
        }
        break;
      }
      case 'google':openExternal(googleLink(p));break;
    }
  }
  function locate(){
    if(!navigator.geolocation){showToast(loc('locateError'));return;}
    E('locate').disabled=true;
    navigator.geolocation.getCurrentPosition(position=>{
      E('locate').disabled=false;
      const {latitude:lat,longitude:lon}=position.coords;
      if(!inKorea(lat,lon)){showToast(loc('locateError'));return;}
      state.you={lat,lon};
      if(state.map){if(state.youMarker)state.youMarker.remove();state.youMarker=createMarker(lat,lon,'<div class="my-location-marker"></div>');flyToPlace(lat,lon,15,600);}
    },()=>{E('locate').disabled=false;showToast(loc('locateError'));},{enableHighAccuracy:true,timeout:11000,maximumAge:40000});
  }
  function restoreLink(){
    try{
      const params=new URLSearchParams(location.search);
      const lat=Number(params.get('lat')),lon=Number(params.get('lon'));
      if(!params.has('lat')||!params.has('lon')||!inKorea(lat,lon))return;
      const name=(params.get('ko')||'공유된 위치').slice(0,100),jname=(params.get('ja')||'共有された位置').slice(0,100);
      state.searched=true;state.results=[{id:'shared-'+lat+'-'+lon,ko:name,ja:jname,lat,lon,type:'pin',area:coords({lat,lon}),source:'custom',approximate:false}];
      state.selected=state.results[0];render();refreshMarkers();if(state.map)state.map.jumpTo({center:[lon,lat],zoom:15});
    }catch(err){console.warn('Cannot read shared location:',err);}
  }
  function bind(){
    E('search-form').addEventListener('submit',e=>{e.preventDefault();submitSearch();E('search-input').blur();});
    E('search-input').addEventListener('input',()=>E('clear-search').classList.toggle('hidden',!E('search-input').value));
    E('clear-search').addEventListener('click',()=>{E('search-input').value='';E('clear-search').classList.add('hidden');E('search-input').focus();});
    E('lang-ko').addEventListener('click',()=>setLang('ko'));
    E('lang-ja').addEventListener('click',()=>setLang('ja'));
    E('quick-search').addEventListener('click',e=>{const btn=e.target.closest('[data-query]');if(btn)submitSearch(btn.dataset.query);});
    $$('.tab').forEach(node=>node.addEventListener('click',()=>chooseTab(node.dataset.tab)));
    E('panel-content').addEventListener('click',event=>{
      const place=event.target.closest('[data-place]');
      if(place){const pool=[...state.results,...state.favorites,...state.recent,...seeds];const match=pool.find(x=>x.id===place.dataset.place);choosePlace(match);return;}
      const act=event.target.closest('[data-action]');if(act){doAction(act.dataset.action);return;}
      const mode=event.target.closest('[data-mode]');if(mode){state.mode=mode.dataset.mode;render();}
    });
    E('zoom-in').addEventListener('click',()=>state.map?.zoomIn({duration:250}));
    E('zoom-out').addEventListener('click',()=>state.map?.zoomOut({duration:250}));
    E('locate').addEventListener('click',locate);
    $$('[data-city]').forEach(button=>button.addEventListener('click',()=>{const id=button.dataset.city,p=CITIES[id];state.city=id;$$('[data-city]').forEach(b=>b.classList.toggle('active',b.dataset.city===id));flyToPlace(p[0],p[1],p[2],700);}));
    E('about-open').addEventListener('click',()=>E('about-dialog').classList.remove('hidden'));
    for(const id of ['about-close','about-ok'])E(id).addEventListener('click',()=>E('about-dialog').classList.add('hidden'));
    E('about-dialog').addEventListener('click',e=>{if(e.target===E('about-dialog'))E('about-dialog').classList.add('hidden');});
    document.addEventListener('keydown',e=>{
      if(e.key==='Escape'){if(!E('about-dialog').classList.contains('hidden'))E('about-dialog').classList.add('hidden');else if(state.selected)back();else E('search-input').blur();}
      if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();E('search-input').focus();}
    });
  }
  function init(){bind();initialMap();setLang(state.lang);restoreLink();}
  init();
  window.NABI_TEST={localMatches,normalize,kakaoLink,googleLink,mergeResults,seedCount:seeds.length,placeCount:()=>state.results.length,search:submitSearch,getState:()=>({...state,map:null})};
})();

</script>
