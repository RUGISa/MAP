const cleanPlace=p=>{if(!p||!realNum(p.lat)||!realNum(p.lon))return null;let lat=Number(p.lat),lon=Number(p.lon);if(!isKR(lat,lon))return null;return {id:String(p.id||'loc-'+lat+'-'+lon).slice(0,90),ko:String(p.ko||'').slice(0,140),ja:String(p.ja||'').slice(0,140),lat,lon,type:String(p.type||'generic'),area:String(p.area||'').slice(0,180),aliases:Array.isArray(p.aliases)?p.aliases:[],source:String(p.source||'coordinate'),approximate:p.approximate!==false};};
const state={lang:read('nabi03-lang','ko'),view:'discover',city:'busan',query:'',searched:false,results:[],selected:null,loading:false,status:'',favorites:[],recent:[],map:null,ready:false,markers:[],selectedMarker:null,userMarker:null,dark:false,toastTimer:0,requestSeq:0,searchCache:new Map(),mapAttempt:0};

function emptyHTML(which){let typ=which==='saved'?'emptySaved':which==='recent'?'emptyRecent':which==='unsupported'?'unsupportedTitle':'noResult',sub=which==='saved'?'emptySavedSub':which==='recent'?'emptyRecentSub':which==='unsupported'?'unsupportedText':'noResultSub';return `<div class="empty-state"><span class="empty-symbol">${icon(which==='unsupported'?'alert':which==='saved'?'bookmark':which==='recent'?'clock':'search')}</span><strong>${esc(t(typ))}</strong><p>${esc(t(sub))}</p><button type="button" data-action="home">${esc(t('emptyAction'))}</button></div>`;}

function externalLinks(p){const ko=p.ko||p.ja||'위치';const position=cstr(p);return {kakao:'https://map.kakao.com/link/map/'+encodeURIComponent(ko)+','+p.lat+','+p.lon,google:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(position),naver:'https://map.naver.com/p/search/'+encodeURIComponent(ko)};}
function routeURL(p){return 'https://map.kakao.com/link/to/'+encodeURIComponent(p.ko||p.ja||'목적지')+','+p.lat+','+p.lon;}
function renderDetail(){const node=$('placeCard'),p=state.selected;$('app').classList.toggle('detail-active',Boolean(p));if(!p){node.hidden=true;node.innerHTML='';return}const urls=externalLinks(p);node.hidden=false;node.innerHTML=`<div class="detail-top"><span class="detail-index">NABI PLACE / ${esc(sourceTag(p))}</span><button class="detail-close" data-detail="close" aria-label="닫기" type="button">×</button></div><div class="detail-content"><div class="detail-category">${icon(placeIcon(p))}<span>${esc(p.area||sourceTag(p))}</span></div><h2 class="detail-title">${esc(name(p))}</h2><p class="detail-subtitle">${esc(altName(p)||cstr(p))}</p><div class="detail-address">${icon('pin')}<span>${esc(p.area||cstr(p))}<br><span style="font-size:10px;color:#96a798">${esc(cstr(p))}</span></span></div><p class="detail-note">${esc(sourceNote(p))}</p><div class="primary-actions"><button class="route-btn" type="button" data-detail="route">${icon('route')}${esc(t('direction'))}</button><button class="save-btn" type="button" data-detail="save">${icon(saved(p)?'saved':'bookmark')}${esc(t(saved(p)?'saved':'save'))}</button></div><div class="secondary-actions"><button type="button" data-detail="copy">${icon('copy')}${esc(t('copy'))}</button><button type="button" data-detail="share">${icon('share')}${esc(t('share'))}</button></div><div class="external-section"><p class="external-title">${esc(t('external'))}</p><div class="external-links"><a href="${esc(urls.kakao)}" target="_blank" rel="noopener noreferrer">${esc(t('kakao'))}</a><a href="${esc(urls.naver)}" target="_blank" rel="noopener noreferrer" title="장소명으로 다시 검색">${esc(t('naver'))}</a><a href="${esc(urls.google)}" target="_blank" rel="noopener noreferrer">${esc(t('google'))}</a></div></div></div>`;}
function choose(p,move=true){p=cleanPlace(p);if(!p)return;state.selected=p;storeRecent(p);renderDetail();renderPanel();updateMarkers();if(move&&state.ready)state.map.flyTo({center:[p.lon,p.lat],zoom:Math.max(state.map.getZoom(),14.5),duration:1100,essential:true,padding:{left:window.innerWidth>760?290:0,bottom:window.innerWidth<=760?130:0}});}
function home(){state.view='discover';state.searched=false;state.query='';state.results=[];state.selected=null;state.status='';state.requestSeq++;$('searchInput').value='';$('clearInput').hidden=true;renderPanel();renderDetail();updateMarkers();$('panelScroll').scrollTop=0;}
function setCity(city){if(!cityViews[city])return;state.city=city;document.querySelectorAll('[data-city]').forEach(el=>el.classList.toggle('active',el.dataset.city===city));updateMarkers();if(state.ready){const c=cityViews[city];state.map.flyTo({center:[c[0],c[1]],zoom:c[2],duration:1050,essential:true});}if(!state.searched)renderPanel();}
function localMatches(q){const n=norm(q);if(!n)return [];return NABI_PLACES.map(p=>{let names=[p.ko,p.ja,...p.aliases].map(norm);let score=0;for(const word of names){if(word===n)score=Math.max(score,140);else if(word.startsWith(n)&&n.length>1)score=Math.max(score,96);else if(word.includes(n)&&n.length>1)score=Math.max(score,54);else if(n.includes(word)&&word.length>2)score=Math.max(score,22);}if(p.area.startsWith(state.city==='busan'?'부산':state.city==='seoul'?'서울':'제주'))score+=score?2:0;return {p,score};}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,9).map(x=>x.p);}
function customPoint(lat,lon,ko='',source='coordinate',ja=''){return {id:`${source}-${lat.toFixed(5)}-${lon.toFixed(5)}`,lat,lon,ko:ko||`${lat.toFixed(5)}, ${lon.toFixed(5)}`,ja,type:'generic',area:'',aliases:[],source,approximate:true};}
function coordsFromText(q){const m=q.trim().match(/^\(?\s*(-?\d{1,3}(?:\.\d+)?)\s*[,，\s]+\s*(-?\d{1,3}(?:\.\d+)?)\s*\)?$/);if(!m)return null;let a=Number(m[1]),b=Number(m[2]);return isKR(a,b)?[a,b]:null;}
function decodeSafe(s){try{return decodeURIComponent(s.replace(/\+/g,' '))}catch{return s}}
function parseMapURL(raw){let u;try{u=new URL(raw.trim())}catch{return null}if(!/^https?:$/.test(u.protocol))return null;let host=u.hostname.toLowerCase(),path=decodeSafe(u.pathname);const params=u.searchParams;
 function result(lat,lon,label='',source='link'){lat=Number(lat);lon=Number(lon);if(!isKR(lat,lon))return {kind:'unsupported'};return {kind:'point',place:customPoint(lat,lon,(label||'').slice(0,90),source)};}
 function fromText(s){return s?{kind:'text',query:s.slice(0,160)}:{kind:'unsupported'};}
 const latLon=(s)=>{let m=String(s||'').match(/(-?\d{1,3}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)/);return m?[Number(m[1]),Number(m[2])]:null};
 if(host.includes('google.')||host==='maps.app.goo.gl'||host==='goo.gl'){
  if(host.includes('goo.gl'))return {kind:'unsupported'};
  let match=decodeSafe(u.href).match(/!3d(-?\d{1,3}\.\d+)!4d(-?\d{1,3}\.\d+)/);if(match)return result(match[1],match[2],path.split('/place/')[1]?.split('/')[0]?.replace(/\+/g,' ')||'','link');
  const q=params.get('query')||params.get('q')||'';let c=latLon(q);if(c&&isKR(c[0],c[1]))return result(c[0],c[1],'','link');
  if(q)return fromText(q);
  const at=path.match(/@(-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)/);if(at)return result(at[1],at[2],'','link-center');
  const p=path.split('/place/')[1]?.split('/')[0];if(p)return fromText(p.replace(/\+/g,' '));return {kind:'unsupported'};
 }
 if(host.includes('kakao.com')){
   const m=path.match(/\/link\/(?:map|to)\/(.*)/);if(m){const bits=m[1].split('/')[0].split(',');if(bits.length>=3){const lat=bits[bits.length-2],lon=bits[bits.length-1];return result(lat,lon,bits.slice(0,-2).join(','),'link')}if(bits.length===2)return result(bits[0],bits[1],'','link');return {kind:'unsupported'}}
   return fromText(params.get('q')||params.get('query')||'');
 }
 if(host==='naver.me')return {kind:'unsupported'};
 if(host.includes('naver.com')){
   const c=params.get('c');if(c){const match=latLon(c);if(match)return result(match[1],match[0],'','link-center')}
   const q=path.match(/\/search\/(.+)/);if(q)return fromText(q[1]);return {kind:'unsupported'};
 }
 if(host==='nabi.map'||host===location.hostname){let lat=params.get('lat'),lon=params.get('lon');if(lat&&lon)return result(lat,lon,params.get('ko')||'','link')}
 return {kind:'unsupported'};
}
function featureToPlace(feature){const coords=feature?.geometry?.coordinates,p=feature?.properties||{};if(!Array.isArray(coords)||coords.length<2)return null;const lon=Number(coords[0]),lat=Number(coords[1]);if(!isKR(lat,lon))return null;const title=String(p.name||p.street||p.city||p.district||'').trim();if(!title)return null;return {id:'photon-'+(p.osm_type||'')+'-'+(p.osm_id||lat+'-'+lon),ko:title,ja:'',lat,lon,type:p.osm_key==='railway'?'station':p.osm_key==='tourism'?'sight':'generic',area:[p.city,p.district,p.state].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).join(' · '),aliases:[],source:'photon',approximate:false};}
async function photonSearch(q,seq){const cacheKey=norm(q);if(state.searchCache.has(cacheKey))return state.searchCache.get(cacheKey);const delay=Math.max(0,1250-(Date.now()-(state.lastPhoton||0)));if(delay)await new Promise(resolve=>setTimeout(resolve,delay));if(seq!==state.requestSeq)return [];state.lastPhoton=Date.now();const params=new URLSearchParams({q,limit:'8',lang:state.lang,bbox:'124.5,32.7,131.1,39.5'});const ctrl=new AbortController();const timeout=setTimeout(()=>ctrl.abort(),6500);try{const res=await fetch('https://photon.komoot.io/api/?'+params.toString(),{signal:ctrl.signal});if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();const found=(data.features||[]).map(featureToPlace).filter(Boolean);state.searchCache.set(cacheKey,found);return found;}finally{clearTimeout(timeout)}}
async function runSearch(raw){const q=String(raw??'').trim();if(!q)return;$('searchInput').value=q;state.query=q;state.searched=true;state.view='discover';state.selected=null;state.results=[];state.status='';const seq=++state.requestSeq;state.loading=false;renderDetail();$('panelScroll').scrollTop=0;
 const coords=coordsFromText(q);if(coords){state.results=[customPoint(coords[0],coords[1])];renderPanel();choose(state.results[0]);return}
 let searchText=q;
 if(/^https?:\/\//i.test(q)){
  const parsed=parseMapURL(q);
  if(parsed?.kind==='point'){state.results=[parsed.place];renderPanel();choose(parsed.place);return}
  if(parsed?.kind==='text')searchText=parsed.query;
  else{state.status='unsupported';renderPanel();showToast(t('toastUnsupported'));return}
 }
 const local=localMatches(searchText);state.results=local;state.loading=true;renderPanel();if(local.length===1)choose(local[0]);
 try{const live=await photonSearch(searchText,seq);if(seq!==state.requestSeq)return;const merged=[...local];for(const p of live){if(merged.some(v=>Math.hypot(v.lat-p.lat,v.lon-p.lon)<0.00032))continue;merged.push(p)}state.results=merged;state.status='ok';}catch{if(seq!==state.requestSeq)return;state.status='error';}finally{if(seq===state.requestSeq){state.loading=false;renderPanel()}}
}
function markerEl(p,selected=false){let el=document.createElement('div');el.className='nabi-pin'+(selected?' is-selected':'');el.innerHTML='<svg viewBox="0 0 38 46" aria-hidden="true"><path d="M19 1C8.7 1 1 9.6 1 20.1c0 11.6 18 24.4 18 24.4S37 31.7 37 20.1C37 9.6 29.3 1 19 1Z"/><circle cx="19" cy="19" r="6" fill="#fff" stroke="none"/></svg>';el.title=p.ko||p.ja||'위치';el.addEventListener('click',e=>{e.stopPropagation();choose(p)});return el;}
function clearMarkers(){state.markers.forEach(m=>m.remove());state.markers=[];if(state.selectedMarker){state.selectedMarker.remove();state.selectedMarker=null}}
function updateMarkers(){if(!state.ready||!state.map)return;clearMarkers();const ids=featured[state.city];const list=ids.map(id=>byId.get('seed-'+id)).filter(Boolean);list.forEach(p=>{if(p.id===state.selected?.id)return;state.markers.push(new maplibregl.Marker({element:markerEl(p)}).setLngLat([p.lon,p.lat]).addTo(state.map));});if(state.selected)state.selectedMarker=new maplibregl.Marker({element:markerEl(state.selected,true),anchor:'bottom'}).setLngLat([state.selected.lon,state.selected.lat]).addTo(state.map);}
function mapFailure(){state.ready=false;$('mapFallback').hidden=false;}
function initMap(){if(state.map||!window.maplibregl)return;try{state.mapAttempt++;$('mapFallback').hidden=true;state.map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/positron',center:[cityViews.busan[0],cityViews.busan[1]],zoom:cityViews.busan[2],minZoom:5.5,maxZoom:19,attributionControl:true,pitchWithRotate:false,dragRotate:false,touchPitch:false});state.map.touchZoomRotate.disableRotation();let alive=false;const attempt=state.mapAttempt;const timeout=setTimeout(()=>{if(!alive&&attempt===state.mapAttempt)mapFailure()},13000);state.map.on('load',()=>{alive=true;clearTimeout(timeout);state.ready=true;$('mapFallback').hidden=true;if(state.selected)state.map.jumpTo({center:[state.selected.lon,state.selected.lat],zoom:14.5});updateMarkers();});state.map.on('error',e=>{if(!alive&&e.error&&String(e.error.message||'').match(/(fetch|network|load|403|404)/i)){/* timeout handles full failure */}});state.map.on('click',e=>{const lat=e.lngLat.lat,lon=e.lngLat.lng;if(isKR(lat,lon))choose(customPoint(lat,lon,'','pin'),false)});state.map.on('moveend',()=>{});}catch{mapFailure();}}
function openURL(url){window.open(url,'_blank','noopener,noreferrer')}
async function shareSelected(){const p=state.selected;if(!p)return;let text=`${name(p)} / ${altName(p)||''}\n${cstr(p)}\n`+externalLinks(p).google;if(location.protocol.startsWith('http')){const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('lat',p.lat);u.searchParams.set('lon',p.lon);u.searchParams.set('ko',p.ko);if(p.ja)u.searchParams.set('ja',p.ja);text=u.toString();}if(navigator.share){try{await navigator.share({title:name(p),text:`${name(p)} · ${cstr(p)}`,url:location.protocol.startsWith('http')?text:externalLinks(p).google});return}catch{}}showToast((await clipboard(text))?t('toastShare'):t('toastClipboard'));}
async function pasteLink(){let value='';try{if(navigator.clipboard&&window.isSecureContext)value=await navigator.clipboard.readText()}catch{}if(value&&value.trim()){$('searchInput').value=value.trim();$('clearInput').hidden=false;await runSearch(value.trim());}else{$('searchInput').focus();showToast(t('toastNoLink'))}}
function bootEvents(){
 $('searchForm').addEventListener('submit',e=>{e.preventDefault();runSearch($('searchInput').value)});
 $('searchInput').addEventListener('input',()=>{$('clearInput').hidden=!$('searchInput').value.trim()});
 $('clearInput').addEventListener('click',()=>{home();$('searchInput').focus()});$('goHome').addEventListener('click',home);
 document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{state.lang=b.dataset.lang;save('nabi03-lang',state.lang);translate()}));
 document.querySelectorAll('[data-city]').forEach(b=>b.addEventListener('click',()=>setCity(b.dataset.city)));
 document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{state.view=b.dataset.view;renderPanel();$('panelScroll').scrollTop=0;}));
 $('chips').addEventListener('click',e=>{let btn=e.target.closest('[data-chip]');if(!btn)return;const v=btn.dataset.chip;if(v==='paste')pasteLink();else runSearch(v)});
 $('panelContent').addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;const place=btn.dataset.place,action=btn.dataset.action;if(place){const p=[...state.results,...state.favorites,...state.recent,...NABI_PLACES].find(x=>x.id===place);if(p)choose(p)}if(action==='home')home();if(action==='paste')pasteLink();if(action==='coord-example')runSearch('35.2293, 129.0896');if(action==='clearRecent'){state.recent=[];save('nabi03-recent',[]);showToast(t('toastHistory'));renderPanel()}});
 $('placeCard').addEventListener('click',async e=>{const a=e.target.closest('[data-detail]');if(!a||!state.selected)return;const action=a.dataset.detail;if(action==='close'){state.selected=null;renderDetail();updateMarkers();renderPanel()}if(action==='save')toggleSaved();if(action==='copy')showToast((await clipboard(cstr(state.selected)))?t('toastCopied'):t('toastClipboard'));if(action==='share')shareSelected();if(action==='route')openURL(routeURL(state.selected));});
 $('zoomIn').addEventListener('click',()=>state.ready?state.map.zoomIn({duration:250}):showToast(t('toastOffline')));
 $('zoomOut').addEventListener('click',()=>state.ready?state.map.zoomOut({duration:250}):showToast(t('toastOffline')));
 $('styleBtn').addEventListener('click',()=>{if(!state.ready)return showToast(t('toastOffline'));state.dark=!state.dark;state.map.setStyle('https://tiles.openfreemap.org/styles/'+(state.dark?'dark':'positron'));state.map.once('style.load',()=>updateMarkers())});
 $('locateBtn').addEventListener('click',()=>{if(!navigator.geolocation)return showToast(t('toastGeoloc'));navigator.geolocation.getCurrentPosition(pos=>{const {latitude:lat,longitude:lon}=pos.coords;if(!isKR(lat,lon))return showToast(t('toastGeoloc'));choose(customPoint(lat,lon,state.lang==='ja'?'現在地':'현재 위치','coordinate'));},()=>showToast(t('toastGeoloc')),{enableHighAccuracy:false,timeout:9000,maximumAge:60000})});
 $('retryMap').addEventListener('click',()=>{if(state.map){try{state.map.remove()}catch{}state.map=null;state.ready=false}initMap()});
 $('aboutBtn').addEventListener('click',()=>$('aboutDialog').showModal());$('closeDialog').addEventListener('click',()=>$('aboutDialog').close());$('aboutDialog').addEventListener('click',e=>{if(e.target===$('aboutDialog'))$('aboutDialog').close()});
 document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('searchInput').focus();$('searchInput').select()}if(e.key==='Escape'&&!$('aboutDialog').open&&state.selected){state.selected=null;renderDetail();updateMarkers();renderPanel()}});
}
function bootLink(){const p=new URLSearchParams(location.search);if(p.has('lat')&&p.has('lon')){const lat=Number(p.get('lat')),lon=Number(p.get('lon'));if(isKR(lat,lon)){const place=customPoint(lat,lon,p.get('ko')||'','link',p.get('ja')||'');state.results=[place];state.searched=true;choose(place,false)}}}
window.NABI_maplibreReady=initMap;window.NABI_maplibreFailed=mapFailure;
hydrateIcons();bootEvents();translate();bootLink();setTimeout(()=>{if(!window.maplibregl&&!state.ready)mapFailure()},10000);
})();

</script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" onload="window.NABI_maplibreReady?.()" onerror="window.NABI_maplibreFailed?.()"></script>
</body>
