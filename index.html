.city-switch{position:absolute;z-index:6;right:22px;top:22px;background:#fffffff5;border:1px solid #e7edf4;border-radius:11px;padding:5px;display:flex;gap:3px;box-shadow:0 5px 19px #24436416}.city-switch button{font-size:12px;padding:10px 14px;border-radius:7px;font-weight:720;color:#78869b}.city-switch button.active{background:var(--blue);color:white}.map-controls{position:absolute;z-index:6;right:22px;top:50%;transform:translateY(-50%);background:#fff;border:1px solid #e5ebf2;border-radius:12px;box-shadow:0 6px 23px #22416916;display:grid;padding:5px}.map-controls button{width:40px;height:40px;display:grid;place-items:center;color:#53677f}.map-controls button:hover{color:var(--blue);background:#f3f7ff;border-radius:8px}.map-controls span{height:1px;background:#ebeff3;margin:3px 5px}.marker{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;border:none;background:transparent;padding:0;filter:drop-shadow(0 3px 5px #22446e38)}.marker svg{width:33px;height:42px;fill:var(--blue);stroke:#fff;stroke-width:1.7}.marker.selected svg{width:42px;height:54px;fill:#154dbb}.marker-label{position:absolute;top:40px;left:50%;transform:translateX(-50%);background:white;border-radius:5px;padding:4px 7px;border:1px solid #e3ebf1;font-size:10px;font-weight:770;white-space:nowrap;box-shadow:0 3px 7px #19314f14;color:#34506d}.marker.selected .marker-label{top:52px;color:#1b4bac}.detail{position:absolute;z-index:8;width:355px;right:77px;bottom:35px;background:#fff;border:1px solid #e2eaf1;border-radius:16px;box-shadow:0 14px 44px #1a365a29;overflow:hidden}.detail[hidden]{display:none}.detail-top{padding:20px 20px 18px;border-bottom:1px solid #eff2f6}.detail-kicker{font-size:10px;color:var(--blue);font-weight:740;letter-spacing:.3px;display:flex;gap:6px;align-items:center}.detail-close{position:absolute;top:13px;right:14px;width:30px;height:30px;border-radius:8px;color:#8596aa;font-size:22px}.detail-close:hover{background:#f4f7fa}.detail-title{font-size:21px;margin-top:9px;letter-spacing:-.65px;font-weight:820;line-height:1.25;padding-right:28px}.detail-alt{font-size:12px;color:#8796a9;margin-top:6px}.detail-area{font-size:11px;color:#8796a9;margin-top:10px}.detail-warning{color:#a0aab5;font-size:10.5px;line-height:1.5;margin-top:8px}.detail-actions{padding:14px 18px 10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.detail-actions button{height:42px;border-radius:9px;font-weight:760;font-size:12px;display:flex;align-items:center;justify-content:center;gap:7px}.detail-actions svg{width:17px;height:17px}.primary-action{background:var(--blue);color:white}.secondary-action{background:#edf3fe;color:#2d60c6}.minor-actions{display:flex;align-items:center;gap:4px;padding:0 17px 12px}.minor-actions button{flex:1;color:#70849b;font-size:10px;padding:9px 3px;display:flex;align-items:center;justify-content:center;gap:4px}.minor-actions button:hover{color:var(--blue)}.minor-actions svg{width:13px;height:13px}.out-links{display:flex;align-items:center;gap:5px;border-top:1px solid #eef2f7;padding:12px 16px 14px}.out-links a{flex:1;text-align:center;padding:9px 3px;border:1px solid #e4eaf3;border-radius:8px;color:#5a6c86;text-decoration:none;font-size:10.5px;font-weight:720;white-space:nowrap}.out-links a:hover{border-color:#9ebcf6;color:var(--blue);background:#f5f8ff}.toast{position:absolute;left:50%;bottom:26px;transform:translate(-50%,12px);z-index:40;padding:11px 18px;background:#192a42;color:white;border-radius:9px;box-shadow:0 8px 28px #182c4940;font-size:12px;font-weight:650;opacity:0;pointer-events:none;max-width:90vw;transition:opacity .2s,transform .2s;text-align:center}.toast.show{transform:translate(-50%,0);opacity:1}.about{max-width:min(430px,calc(100vw - 36px));border:0;border-radius:15px;box-shadow:0 24px 75px #102b4780;padding:0;color:var(--ink)}.about::backdrop{background:#16273a8c}.about-head{display:flex;align-items:center;justify-content:space-between;padding:22px;border-bottom:1px solid var(--border)}.abo @media(max-width:900px){.panel{width:350px}.detail{width:325px;right:68px}.map-status{left:60%}}
@media(max-width:690px){.app{height:100dvh}.panel{top:12px;left:12px;right:12px;bottom:auto;width:auto;border-radius:14px;max-height:45dvh}.brand-line{height:56px;padding:0 14px}.brand-type{font-size:23px}.brand-product{font-size:10px}.lang-toggle button{font-size:10px;padding:6px 8px}.search-form{height:47px;margin:0 12px;padding:3px 4px 3px 11px}.search-submit{height:39px;width:39px}.search-form input{font-size:12px}.search-tools{padding:6px 13px 9px}.search-tools>span{font-size:9px}.search-tools button{font-size:10px}.tabs{height:40px;padding:0 15px;gap:21px}.tabs button{font-size:11px}.panel-scroll{min-height:0;max-height:calc(45dvh - 185px)}.panel-bottom{display:none}.panel-headline{padding:12px 16px 6px}.panel-headline h1{font-size:16px;margin-top:4px}.panel-headline p{display:none}.category-bar{padding:6px 14px 8px}.category{padding:6px 9px;font-size:10px}.results-head{margin:4px 16px 0}.place-list{padding:0 7px 9px}.place-row{min-height:59px;padding:8px}.place-icon{width:32px;height:32px;min-width:32px}.place-icon svg{width:17px;height:17px}.place-info strong{font-size:12px}.place-info .foreign{font-size:10px}.place-info .area{display:none}.city-switch{top:auto;bottom:calc(18px + env(safe-area-inset-bottom));right:50%;transform:translateX(50%);padding:4px;border-radius:30px}.city-switch button{padding:10px 17px;border-radius:24px}.map-controls{top:56%;right:12px;padding:3px}.map-controls button{width:37px;height:37px}.detail{width:auto;right:12px;left:12px;bottom:calc(65px + env(safe-area-inset-bottom));border-radius:14px}.detail-top{padding:14px 15px 12px}.detail-title{font-size:18px;margin-top:6px}.detail-alt{margin-top:4px;font-size:11px}.detail-area{margin-top:7px}.detail-warning{font-size:9px;margin-top:6px}.detail-actions{padding:9px 12px 4px}.detail-actions button{height:39px}.minor-actions{padding:0 12px 5px}.out-links{padding:9px 12px 11px}.out-links a{font-size:10px;padding:8px 1px}.app.has-detail .panel-scroll,.app.has-detail .tabs,.app.has-detail <body>
<main class="app" id="app">
  <div class="map-canvas" id="mapCanvas" aria-label="한국 지도" role="application">
    <div id="tiles" class="tiles"></div>
    <div id="markers" class="markers"></div>
  </div>
  <div class="map-shade" aria-hidden="true"></div>
  <div class="map-status" id="mapStatus" role="status" hidden>
    <div class="status-illustration" aria-hidden="true">⌁</div>
    <strong id="mapStatusTitle">지도를 불러오는 중입니다</strong>
    <p id="mapStatusText">잠시만 기다려 주세요.</p>
    <button type="button" class="status-retry" id="retryMap" hidden>다시 불러오기</button>
  </div>

  <aside class="panel" id="panel" aria-label="검색 및 장소 목록">
    <div class="panel-top">
      <div class="brand-line">
        <button class="brand" type="button" id="homeBtn" aria-label="NABI MAP 홈">
          <span class="brand-symbol" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span class="brand-type">nabi<span class="brand-point">.</span></span>
          <span class="brand-product">map</span>
        </button>
        <div class="lang-toggle" aria-label="표시 언어 선택">
          <button type="button" data-lang="ko" class="active">한국어</button>
          <button type="button" data-lang="ja">日本語</button>
        </div>
      </div>
      <form id="searchForm" class="search-form" autocomplete="off" role="search">
        <span class="search-glass" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></span>
        <input id="searchInput" type="search" placeholder="장소, 주소, 지도 링크 검색" aria-label="장소 검색" enterkeyhint="search" spellcheck="false">
        <button class="clear-btn" type="button" id="clearBtn" aria-label="검색 초기화" hidden>×</button>
        <button class="search-submit" type="submit" aria-label="검색"><svg viewBox="0 0 24 24"><path d="M4 12h16m-7-7 7 7-7 7"/></svg></button>
      </form>
      <div class="search-tools">
        <span id="searchHint">한국어 · 日本語 · 좌표 · 지도 URL</span>
        <button type="button" id="pasteBtn"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="13" height="16" rx="2"/><path d="M9 5.5V3h7v2.5M4 9H3v11a2 2 0 0 0 2 2h9"/></svg><span id="pasteLabel">링크 붙여넣기</span></button>
      </div>
      <div class="tabs" role="tablist" aria-label="목록 전환">
        <button type="button" class="active" data-tab="explore" role="tab" aria-selected="true" id="exploreTab">탐색</button>
        <button type="button" data-tab="saved" role="tab" aria-selected="false" id="savedTab">저장한 장소 <small id="savedCount"></small></button>
        <button type="button" data-tab="recent" role="tab" aria-selected="false" id="recentTab">최근 본 장소</button>
      </div>
    </div>
    <div class="panel-scroll" id="panelScroll" tabindex="0"><div id="panelBody"></div></div>
    <div class="panel-bottom"><span class="online-dot"></span><span id="footerText">한국 지도 · 다국어 검색 베타</span><button id="infoBtn" type="button" aria-label="서비스 정보">ⓘ</button></div>
  </aside>

  <div class="city-switch" aria-label="지역 선택">
    <button type="button" data-city="seoul">서울</button>
    <button type="button" data-city="busan" class="active">부산</button>
    <button type="button" data-city="jeju">제주</button>
  </div>
  <div class="map-controls" aria-label="지도 조작">
    <button type="button" id="locateBtn" aria-label="현재 위치" title="현재 위치"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></svg></button>
    <span></span>
    <button type="button" id="zoomIn" aria-label="지도 확대" title="확대"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button type="button" id="zoomOut" aria-label="지도 축소" title="축소"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
  </div>
  <div class="detail" id="detail" hidden aria-live="polite"></div>
  <div class="attribution" id="attribution">© OpenStreetMap contributors</div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</main>
<dialog class="about" id="aboutDialog">
  <div class="about-head"><strong>nabi<span>.</span> map</strong><button id="closeInfo" type="button" aria-label="닫기">×</button></div>
  <div id="aboutBody"></div>
</dialog>
<script>
const NABI_PLACES = [
// Busan
['busan-uni','부산대역','釜山大学駅',35.2293,129.0896,'station','부산 · 금정구',['부산대학교역','부산대 역','プサンデ駅','プサンデえき','釜山大学','부산대역 1호선','Busan National University Station']],
['busan-campus','부산대학교','釜山大学',35.2338,129.0798,'university','부산 · 금정구',['부산대','부산 대학','プサン大学','Pusan National University','PNU']],

 {id:'osm',url:(z,x,y)=>`https://tile.openstreetmap.org/${z}/${x}/${y}.png`,credit:'© OpenStreetMap contributors'},

];
const mlat=lat=>(1-Math.log(Math.tan(Math.PI/4+Math.max(-85.0511,Math.min(85.0511,lat))*Math.PI/360))/Math.PI)/2;

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
class NABIMap {
 constructor(opts){
  this.el=document.getElementById('mapCanvas');this.tilesEl=document.getElementById('tiles');this.markersEl=document.getElementById('markers');
  this.attribution=document.getElementById('attribution');this.status=document.getElementById('mapStatus');
  this.statusTitle=document.getElementById('mapStatusTitle');this.statusText=document.getElementById('mapStatusText');this.retry=document.getElementById('retryMap');
  this.center=[129.065,35.169];this.zoom=12.25;this.source=0;this.loaded=false;this.failed=false;this.gen=0;this.cache=new Map();this.markerDefs=[];

 renderMarkers(){this.markersEl.replaceChildren();const w=this.el.clientWidth,h=this.el.clientHeight;

 if(/^(maps\.app\.goo\.gl|goo\.gl|naver\.me|kko\.to|place\.map\.kakao\.com)$/.test(host))return {error:'linkShort'};
 let lat,lon,kind='coordinate';let whole=u.href;try{whole=decodeURIComponent(u.href)}catch{}const matches=[whole.match(/@(-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)/),whole.match(/!3d(-?\d{1,3}\.\d+)!4d(-?\d{1,3}\.\d+)/),whole.match(/\/link\/(?:to|map|roadview)\/(?:[^/,]+,)?(-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)/),whole.match(/[?&#](?:ll|center|q)=(-?\d{1,3}\.\d+)%?2[Cc](-?\d{1,3}\.\d+)/)];
 for(const m of matches){if(m&&isKorea(+m[1],+m[2])){lat=+m[1];lon=+m[2];break}}
 if(lat===undefined){const c=u.searchParams.get('c');if(c){const m=c.match(/^(-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)/);if(m&&isKorea(+m[2],+m[1])){lon=+m[1];lat=+m[2];kind='center'}}}
 if(lat===undefined){const p=u.searchParams;const a=+(p.get('lat')||p.get('latitude')),b=+(p.get('lon')||p.get('lng')||p.get('longitude'));if(isKorea(a,b)){lat=a;lon=b;kind='center'}}
 if(lat!==undefined){if(u.pathname.includes('/@')||u.pathname.includes('/maps/place/')||u.searchParams.has('c'))kind='center';return {place:point(lat,lon,kind,kind==='center'?t('mapCenter'):'', '')}}
 const q=u.searchParams.get('query')||u.searchParams.get('q')||u.searchParams.get('search');if(q&&q.length<180)return {query:q};return {error:'linkUnknown'}
}
function photonItem(f){try{const prop=f.properties||{},[lon,lat]=f.geometry.coordinates;if(!isKorea(lat,lon))return null;const ko=String(prop['name:ko']||prop.name||prop.street||'').slice(0,120);if(!ko)return null;const ja=String(prop['name:ja']||'').slice(0,120);const area=[prop.city||prop.county||prop.state,prop.district].filter(Boolean).join(' · ').slice(0,150);let type='generic';if(['railway','station','halt','subway_entrance'].includes(prop.osm_value)||prop.type==='station')type='station';else if(['park','garden'].includes(prop.osm_value))type='nature';else if(prop.osm_key==='tourism')type='sight';return safePlace({id:`osm-${prop.osm_type||'X'}-${prop.osm_id||lat+'-'+lon}`,ko,ja,lat,lon,type,area,source:'osm',approximate:true})}catch{return null}}
async function remoteSearch(q,seq){const k=norm(q);if(state.remoteCache.has(k))return state.remoteCache.get(k);const params=new URLSearchParams({q,limit:'8',lang:state.lang,bbox:'124.5,32.7,131.1,39.4'});const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),6500);
 try{const resp=await fetch('https://photon.komoot.io/api/?'+params,{signal:ctrl.signal});if(!resp.ok)throw Error('remote '+resp.status);const json=await resp.json();const items=(json.features||[]).map(photonItem).filter(Boolean);state.remoteCache.set(k,items);return items}finally{clearTimeout(timer)}
}
async function runSearch(raw){let q=String(raw||'').trim();if(!q)return;const urlMatch=q.match(/https?:\/\/[^\s]+/);if(urlMatch){const link=parseMapLink(urlMatch[0]);if(link?.error){toast(t(link.error));return}if(link?.place){state.searched=true;state.tab='explore';state.query=q;state.results=[link.place];selectPlace(link.place);return}if(link?.query)q=link.query;else{toast(t('linkUnknown'));return}}
 const coords=parseCoords(q);if(coords){state.tab='explore';state.searched=true;state.query=q;state.results=[coords];selectPlace(coords);return}
 state.request++;const seq=state.request;state.query=q;state.tab='explore';state.searched=true;state.loading=false;state.networkIssue=false;state.selected=null;$('searchInput').value=q;const local=localSearch(q);state.results=local;render();$('panelScroll').scrollTop=0;
 if(local.length&&[local[0].ko,local[0].ja,...(local[0].aliases||[])].some(v=>norm(v)===norm(q)))selectPlace(local[0]);
 if(local.length>=3)return;
 state.loading=true;renderPanel();try{const live=await remoteSearch(q,seq);if(seq!==state.request)return;const result=local.slice();for(const p of live){if(result.some(x=>Math.hypot(p.lat-x.lat,p.lon-x.lon)<.0004))continue;result.push(p)}state.results=result.slice(0,12)}catch{if(seq!==state.request)return;state.networkIssue=true}finally{if(seq===state.request){state.loading=false;renderPanel();renderMarkers()}}
}
async function paste(){let value='';try{value=await navigator.clipboard.readText()}catch{}if(!value){$('searchInput').focus();toast(t('pasteDenied'));return}$('searchInput').value=value;await runSearch(value)}
async function copyText(text){try{await navigator.clipboard.writeText(text);return true}catch{try{const node=document.createElement('textarea');node.value=text;node.style.position='fixed';node.style.opacity='0';document.body.appendChild(node);node.select();const ok=document.execCommand('copy');node.remove();return ok}catch{return false}}}
function toggleSaved(){const p=state.selected;if(!p)return;if(isSaved(p)){state.saved=state.saved.filter(q=>q.id!==p.id);toast(t('savedRemove'))}else{state.saved.unshift(safePlace(p));toast(t('savedDone'))}store('nabi05-favorites',state.saved);render()}
async function share(){const p=state.selected;if(!p)return;let link=googleURL(p);if(/^https?:$/.test(location.protocol)){const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('lat',p.lat);u.searchParams.set('lon',p.lon);u.searchParams.set('name',p.ko);u.searchParams.set('ja',p.ja);link=u.toString()}
 if(navigator.share){try{await navigator.share({title:name(p),text:alt(p),url:link});return}catch{}}toast((await copyText(link))?t('shareDone'):t('copyFail'))}
function openNew(url){window.open(url,'_blank','noopener,noreferrer')}
function bootLink(){const p=new URLSearchParams(location.search);const lat=+p.get('lat'),lon=+p.get('lon');if(isKorea(lat,lon)){const q=point(lat,lon,'coordinate',String(p.get('name')||'').slice(0,120),String(p.get('ja')||'').slice(0,120));state.results=[q];state.searched=true;selectPlace(q)}}
function events(){
 $('searchForm').addEventListener('submit',e=>{e.preventDefault();runSearch($('searchInput').value)});
 $('searchInput').addEventListener('input',()=>$('clearBtn').hidden=!$('searchInput').value.trim());
 $('clearBtn').addEventListener('click',()=>{state.searched=false;state.query='';state.selected=null;state.results=[];state.request++;$('searchInput').value='';render();$('searchInput').focus()});
 $('homeBtn').addEventListener('click',()=>setCity(state.city));
 $('pasteBtn').addEventListener('click',paste);
 document.querySelectorAll('[data-lang]').forEach(el=>el.addEventListener('click',()=>{state.lang=el.dataset.lang;store('nabi05-lang',state.lang);translate()}));
 document.querySelectorAll('[data-city]').forEach(el=>el.addEventListener('click',()=>setCity(el.dataset.city)));
 document.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>{state.tab=el.dataset.tab;render();$('panelScroll').scrollTop=0}));
 $('panelBody').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.category){state.category=b.dataset.category;renderPanel()}if(b.dataset.place){const p=[...state.results,...state.saved,...state.recent,...NABI_PLACES].find(p=>p.id===b.dataset.place);if(p)selectPlace(p)}if(b.dataset.action==='clear-recent'){state.recent=[];store('nabi05-recent',[]);toast(t('clearDone'));render()}});
 $('detail').addEventListener('click',async e=>{const b=e.target.closest('button[data-detail]');if(!b)return;const what=b.dataset.detail;if(what==='close')clearSelection();else if(what==='route'&&state.selected)openNew(routeURL(state.selected));else if(what==='save')toggleSaved();else if(what==='copy'&&state.selected)toast((await copyText(`${state.selected.lat.toFixed(6)}, ${state.selected.lon.toFixed(6)}`))?t('copyDone'):t('copyFail'));else if(what==='share')share()});
 $('zoomIn').addEventListener('click',()=>map.zoomBy(1));$('zoomOut').addEventListener('click',()=>map.zoomBy(-1));
 $('locateBtn').addEventListener('click',()=>{if(!navigator.geolocation){toast(t('locationFail'));return}navigator.geolocation.getCurrentPosition(pos=>{const {latitude,longitude}=pos.coords;if(!isKorea(latitude,longitude)){toast(t('locationFail'));return}selectPlace(point(latitude,longitude,'coordinate',t('current')))},()=>toast(t('locationFail')),{enableHighAccuracy:false,timeout:8000,maximumAge:60000})});
 $('infoBtn').addEventListener('click',()=>$('aboutDialog').showModal());$('closeInfo').addEventListener('click',()=>$('aboutDialog').close());$('aboutDialog').addEventListener('click',e=>{if(e.target===$('aboutDialog'))$('aboutDialog').close()});
 document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('searchInput').focus();$('searchInput').select()}else if(e.key==='Escape'&&state.selected){clearSelection()}});
}
map=new window.NABIMap({onClick:(lat,lon)=>{if(isKorea(lat,lon))selectPlace(point(lat,lon,'center',t('mapClick')),false)}});
map.setView(...cityCenters[state.city]);events();translate();bootLink();
})();

</script>
